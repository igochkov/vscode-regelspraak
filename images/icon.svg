<!--
  Extension icon — original work for this project.

  Deliberately NOT the regelspraak.nl / Belastingdienst mark: this is an
  unofficial extension, and borrowing the official logo would imply an
  endorsement that does not exist (and would sit badly beside this project's
  clean-room provenance record). See NOTICE.

  The idea rests on a pun the language hands you: in Dutch a *regel* is both
  a rule and a line of text. So the icon is four lines — four "regels" —
  coloured by the convention this extension exists to make visible: purple
  object types, green attributes, orange characteristics, blue roles and
  parameters. Nothing else, because at 48px in the Extensions sidebar
  anything else turns to mush; the palette alone is distinctive enough to
  recognise.

  Hues are more saturated than the in-editor defaults in package.json. Those
  are tuned for reading comfort against a code background; an icon has to
  survive at thumbnail size, where the muted versions go flat.

  Rendered to images/icon.png by scripts/build-icon.mjs. Edit this file, not
  the PNG.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
	<!-- Ground: matches the galleryBanner colour in package.json. -->
	<rect width="256" height="256" rx="56" fill="#1E1B2E"/>

	<!-- Four rules. Ragged right edge so they read as lines of language
	     rather than as a chart or a progress bar. Block is vertically
	     centred: 4 x 22 high + 3 x 16 gaps = 136, leaving 60 top and bottom. -->
	<g>
		<rect x="46" y="60"  width="164" height="22" rx="11" fill="#A855F7"/>
		<rect x="46" y="98"  width="112" height="22" rx="11" fill="#3DBE5C"/>
		<rect x="46" y="136" width="140" height="22" rx="11" fill="#F0932B"/>
		<rect x="46" y="174" width="88"  height="22" rx="11" fill="#3B92E8"/>
	</g>
</svg>
