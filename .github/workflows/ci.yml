name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Lint
        run: npm run lint

      # The example model cites the document it renders (docs/AUTHORING.md).
      # This needs no language server, so unlike the rest of the model's gates
      # it can run here.
      #
      # `samples/sample-wet/` is deliberately not named here and cannot be: its
      # provisions are Dutch law, so every `// Bron:` in it is a Juriconnect
      # reference, and both of this script's questions — does the citation still
      # resolve, is every provision rendered — are about a document beside the
      # model. That folder is gated from the server repository instead, by
      # `npm run model -- check` and `run`, which need no workbench.
      - name: Check the source citations
        run: npm run source:coverage

      # The manifest, the snippets, the language configuration, the generated
      # grammar and the icon: files VS Code reads at install time, which neither
      # `tsc` nor `eslint` nor the suite ever loads. The script is called from
      # the release rehearsal too — every CI gate is a release gate
      # (`docs/RELEASING.md` in the server repository), so a gate that lives only
      # here is one a rehearsal has to reproduce from memory.
      - name: Validate the contributed files and the icon
        run: npm run check:contributions

      # This repository holds the client half of the extension; a publishable
      # .vsix also needs the language server, which is built and released
      # elsewhere. Everything checkable from here is checked above — packaging
      # and publishing are verified where both halves are available.
