name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Everything that can be checked from this repository alone. Runs for every
  # contributor, including forks, which cannot reach the private server repo.
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Validate contributed JSON
        run: |
          node -e '
            const fs = require("node:fs");
            // The snippet file and language configuration allow comments in
            // VS Code, so strip them before parsing.
            const strip = (s) => s.replace(/^\s*\/\/.*$/gm, "");
            for (const f of [
              "package.json",
              "language-configuration.json",
              "snippets/regelspraak.code-snippets",
              "syntaxes/regelspraak.tmLanguage.json",
            ]) {
              JSON.parse(strip(fs.readFileSync(f, "utf8")));
              console.log("ok", f);
            }
          '

      - name: Check the Marketplace icon
        run: |
          node -e '
            const fs = require("node:fs");
            const b = fs.readFileSync("images/icon.png");
            if (b.subarray(0, 8).toString("hex") !== "89504e470d0a1a0a") {
              throw new Error("images/icon.png is not a PNG");
            }
            // IHDR width/height are big-endian uint32 at offsets 16 and 20.
            const w = b.readUInt32BE(16), h = b.readUInt32BE(20);
            console.log(`icon ${w}x${h}`);
            if (w < 128 || h < 128) {
              throw new Error("the Marketplace requires an icon of at least 128x128");
            }
          '

      - name: Check the manifest version is not already published
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "package.json version: $VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::warning::v$VERSION is already tagged. Bump the version before releasing."
          fi

  # The .vsix is only complete with the language server, which lives in a
  # private repository. This job therefore cannot run for forked pull
  # requests — it is skipped rather than failed, so external contributions
  # still get a green `client` job.
  package:
    runs-on: ubuntu-latest
    needs: client
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Check out the language server
        id: server
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: igochkov/regelspraak-lsp
          token: ${{ secrets.SERVER_REPO_TOKEN }}
          path: .server-src

      - name: Skip if the server repository is unavailable
        if: steps.server.outcome != 'success'
        run: |
          echo "::warning::Could not check out igochkov/regelspraak-lsp — is the SERVER_REPO_TOKEN secret set? Skipping packaging."
          exit 0

      - uses: actions/setup-node@v4
        if: steps.server.outcome == 'success'
        with:
          node-version: 20
          cache: npm

      # ANTLR's code generator is a Java tool.
      - uses: actions/setup-java@v4
        if: steps.server.outcome == 'success'
        with:
          distribution: temurin
          java-version: 17

      - name: Build the language server
        if: steps.server.outcome == 'success'
        working-directory: .server-src
        run: |
          npm ci
          npm run gen:parser
          npm run compile
          npm test

      - name: Install client dependencies
        if: steps.server.outcome == 'success'
        run: npm ci

      - name: Stage the server into the extension
        if: steps.server.outcome == 'success'
        run: node scripts/assemble-server.mjs .server-src

      - name: Package
        if: steps.server.outcome == 'success'
        run: npx --yes @vscode/vsce@3.9.2 package -o vscode-regelspraak.vsix

      - name: Verify the packaged server starts and answers
        if: steps.server.outcome == 'success'
        run: node scripts/verify-vsix.mjs vscode-regelspraak.vsix

      - name: Upload VSIX artifact
        if: steps.server.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vscode-regelspraak.vsix
          if-no-files-found: error
